        text:

remove_weekplan_meal:
  name: Remove weekplan meal
  description: Remove a Cookidoo recipe from the meal plan for a date.
  fields:
    date:
      name: Date
      required: true
      selector:
        date:
    recipe_id:
      name: Recipe ID
      required: true
      selector:
        text:

create_favorite_folder:
  name: Create favorite folder
  description: Create an empty Cookidoo custom collection.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:

delete_favorite_folder:
  name: Delete favorite folder
  description: Delete a Cookidoo custom collection (must be empty).
  fields:
    folder_id:
      name: Folder ID
      required: true
      selector:
        text:

move_favorite:
  name: Move favorite
  description: Move a recipe into a Cookidoo collection, or omit folder_id to remove from all collections.
  fields:
    recipe_id:
      name: Recipe ID
      required: true
      selector:
        text:
    folder_id:
      name: Folder ID
      description: Target collection id, or empty to uncategorize.
      selector:
        text:
